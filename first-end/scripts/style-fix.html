<style>
/* ═══════════════════════════════════════════════════════════════
   first-end 梳理文档样式
   自包含、打印友好、核心代码加粗
   ═══════════════════════════════════════════════════════════════ */

/* ── 基础排版 ──────────────────────────────────────────────── */
:root {
  --text: #1a1a1a;
  --bg: #ffffff;
  --border: #e0e0e0;
  --code-bg: #f5f5f5;
  --accent: #2563eb;
  --muted: #6b7280;
  --table-stripe: #f9fafb;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC",
    "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 15px;
  line-height: 1.75;
  color: var(--text);
  background: var(--bg);
  max-width: 960px;
  margin: 0 auto;
  padding: 40px 24px 80px;
}

/* ── 标题层级 ──────────────────────────────────────────────── */
h1 {
  font-size: 1.8em;
  margin: 0 0 8px 0;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--accent);
  color: #111;
}

h2 {
  font-size: 1.35em;
  margin: 40px 0 16px 0;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  color: #222;
}

h3 {
  font-size: 1.1em;
  margin: 28px 0 10px 0;
  color: #333;
}

h4 {
  font-size: 1em;
  margin: 20px 0 8px 0;
  color: #444;
}

/* ── 段落 ──────────────────────────────────────────────────── */
p {
  margin: 8px 0;
}

/* ── 链接 ──────────────────────────────────────────────────── */
a {
  color: var(--accent);
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
}

/* ── 表格 ──────────────────────────────────────────────────── */
table {
  width: 100%;
  border-collapse: collapse;
  margin: 16px 0;
  font-size: 0.95em;
}

thead {
  background: #f0f4ff;
}

th {
  padding: 10px 12px;
  text-align: left;
  font-weight: 600;
  border: 1px solid var(--border);
  white-space: nowrap;
}

td {
  padding: 8px 12px;
  border: 1px solid var(--border);
  vertical-align: top;
}

tr:nth-child(even) td {
  background: var(--table-stripe);
}

/* ── 代码块 ────────────────────────────────────────────────── */
pre {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 14px 16px;
  margin: 12px 0;
  overflow-x: auto;
  font-size: 0.9em;
  line-height: 1.7;
}

code {
  font-family: "Cascadia Code", "Fira Code", "JetBrains Mono", "SF Mono",
    "Consolas", "Courier New", monospace;
  font-size: 0.92em;
}

pre code {
  background: none;
  padding: 0;
}

p code, li code, td code {
  background: #f0f0f0;
  padding: 1px 5px;
  border-radius: 3px;
  font-size: 0.9em;
}

/* ── 核心代码加粗下划线 ────────────────────────────────────── */
/* highlight_core.py 生成的 <b><u> 包裹 */
pre b u,
pre b > u,
b > u {
  font-weight: 700;
  text-decoration: underline;
  text-decoration-color: var(--accent);
  text-underline-offset: 2px;
  color: #0d47a1;
}

/* ── 出题方式标注 ──────────────────────────────────────────── */
p:has(strong:contains("→")) {
  color: var(--accent);
  font-weight: 500;
}

/* ── 块引用 ────────────────────────────────────────────────── */
blockquote {
  border-left: 3px solid var(--accent);
  padding: 4px 16px;
  margin: 12px 0;
  color: var(--muted);
  background: #f8faff;
}

/* ── 列表 ──────────────────────────────────────────────────── */
ul, ol {
  margin: 8px 0 8px 24px;
}

li {
  margin: 4px 0;
}

/* ── 分隔线 ────────────────────────────────────────────────── */
hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 32px 0;
}

/* ── 打印样式 ──────────────────────────────────────────────── */
@media print {
  body {
    font-size: 12px;
    line-height: 1.6;
    max-width: none;
    padding: 20px;
  }

  pre {
    border: 1px solid #ccc;
    background: #fafafa;
    page-break-inside: avoid;
  }

  table {
    page-break-inside: avoid;
  }

  h2 {
    page-break-before: always;
  }

  h2:first-of-type {
    page-break-before: avoid;
  }

  @page {
    margin: 2cm;
  }
}

/* ── 响应式 ────────────────────────────────────────────────── */
@media (max-width: 768px) {
  body {
    font-size: 14px;
    padding: 16px 12px 60px;
  }

  pre {
    padding: 10px 12px;
    font-size: 0.85em;
  }

  table {
    font-size: 0.85em;
  }

  th, td {
    padding: 6px 8px;
  }
}
</style>
